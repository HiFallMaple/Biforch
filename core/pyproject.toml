[tool.poetry]
name = "biforch-core"
version = "0.1.0"
description = "Biforch Core Service for firewall, proxies, and service management"
authors = ["FallMaple <tony53517230@gmail.com>"]
license = "MIT"
readme = "README.md"

packages = [
  { include = "core" }
]

[tool.poetry.dependencies]
python            = ">=3.11,<4.0"
fastapi           = "^0.110"
uvicorn           = { version = "^0.29", extras = ["standard"] }
requests          = "^2.32"
SQLAlchemy        = "^2.0"
pydantic          = "^2.7"
pydantic-settings = "^2.3"
typer = { version = "^0.9.0", extras = ["all"] }
click             = "<8.2.0"

# ---------- Dev dependencies ----------
[tool.poetry.group.dev.dependencies]
pytest         = "^8.2"
pytest-cov     = "^5.0"
pytest-asyncio = "^0.23"
httpx          = "^0.27"
pytest-mock    = "^3.12"
factory-boy    = "^3.3"
freezegun      = "^1.4"

# ---------- CLI entry ----------
[tool.poetry.scripts]
core = "core.cli:app"

# ---------- Build backend ----------
[build-system]
requires      = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"