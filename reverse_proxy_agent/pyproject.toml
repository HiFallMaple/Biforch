[tool.poetry]
name        = "biforch-reverse-proxy-agent"
version     = "0.1.0"
description = "Reverse-proxy agent for Biforch platform"
authors     = ["FallMaple tony53517230@gmail.com"]
license     = "MIT"
readme      = "README.md"

packages = [
  { include = "reverse_proxy_agent" }
]

[tool.poetry.dependencies]
python            = ">=3.11,<4.0"
fastapi           = "^0.110"
uvicorn           = { version = "^0.29", extras = ["standard"] }
requests          = "^2.32"
SQLAlchemy        = "^2.0"
python-dotenv     = "^1.0"
pydantic          = "^2.7"
pydantic-settings = "^2.3"

# ---------- Dev dependencies ----------
[tool.poetry.group.dev.dependencies]
alembic        = "^1.13.1"
pytest         = "^8.2"
pytest-cov     = "^5.0"
pytest-asyncio = "^0.23"
httpx          = "^0.27"
pytest-mock    = "^3.12"
factory-boy    = "^3.3"
freezegun      = "^1.4"

# ---------- CLI entry ----------
[tool.poetry.scripts]
reverse-proxy-agent = "reverse_proxy_agent.api:run"

# ---------- Build backend ----------
[build-system]
requires      = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
